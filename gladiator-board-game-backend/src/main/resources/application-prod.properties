spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

auth.google.client-id=${GOOGLE_CLIENT_ID}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET}

auth.jwt.secret=${JWT_ACCESS_SECRET}
auth.jwt.access-token-ttl-seconds=3600
auth.jwt.issuer=gladiator-backend
auth.jwt.audience=gladiator-frontend

logging.level.org.springframework.security=INFO